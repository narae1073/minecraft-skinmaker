<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>

  <text x="480" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">핵심 구조 — AI는 픽셀을 그리지 않는다</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">AI는 “무엇인가”와 “무슨 색인가”만 판단하고, 모든 픽셀은 코드가 그린다</text>

  <!-- photo -->
  <rect x="16" y="96" width="118" height="104" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="75" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">사진</text>
  <text x="75" y="164" text-anchor="middle" font-size="11" fill="#4f46e5">정면 인물</text>

  <line x1="140" y1="148" x2="170" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- VLM -->
  <rect x="176" y="90" width="176" height="116" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="264" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">VLM (AI)</text>
  <text x="264" y="142" text-anchor="middle" font-size="12" fill="#92400e">분류 + 색 추출</text>
  <rect x="204" y="156" width="120" height="34" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="264" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">생성 픽셀 0개</text>

  <line x1="358" y1="148" x2="388" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- JSON -->
  <rect x="394" y="96" width="152" height="104" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="470" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">속성 JSON</text>
  <text x="470" y="154" text-anchor="middle" font-size="11" fill="#0e7490">top / bottom</text>
  <text x="470" y="172" text-anchor="middle" font-size="11" fill="#0e7490">hair / 색 HEX</text>

  <line x1="552" y1="148" x2="582" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- renderer -->
  <rect x="588" y="90" width="188" height="116" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="682" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">코드 렌더러</text>
  <text x="682" y="146" text-anchor="middle" font-size="12" fill="#166534">파라메트릭 텍스처</text>
  <rect x="612" y="156" width="140" height="34" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="682" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">모든 픽셀을 그림</text>

  <line x1="782" y1="148" x2="812" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- output -->
  <rect x="818" y="96" width="126" height="104" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="881" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">64×64</text>
  <text x="881" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">RGBA PNG</text>

  <!-- invariants bar -->
  <rect x="16" y="238" width="928" height="52" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="480" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">불변식 검증 (validate.py)</text>
  <text x="480" y="281" text-anchor="middle" font-size="11.5" fill="#b91c1c">크기 64×64 · RGBA · 면 겹침 없음 · 내부 레이어 불투명 · 좌우 대칭</text>

  <text x="480" y="318" text-anchor="middle" font-size="11.5" fill="#64748b">렌더러가 하나뿐이라 시임(seam)이 구조적으로 불가능하다</text>
</svg>
