<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="380" fill="#ffffff"/>

  <text x="490" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">파이프라인 — S0 → S4 → 웹</text>
  <text x="490" y="64" text-anchor="middle" font-size="13" fill="#64748b">각 단계는 독립 실행 및 단독 검증이 가능하다</text>

  <!-- S0 -->
  <rect x="20" y="92" width="168" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="104" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">S0 · 입력 게이트</text>
  <text x="104" y="148" text-anchor="middle" font-size="11.5" fill="#4338ca">YuNet 얼굴 검출</text>
  <text x="104" y="170" text-anchor="middle" font-size="11.5" fill="#4338ca">품질 신호 (밝기·흐림)</text>
  <text x="104" y="192" text-anchor="middle" font-size="11.5" fill="#4338ca">다중 얼굴 선택</text>
  <rect x="44" y="206" width="120" height="26" rx="7" fill="#fff" stroke="#f87171"/>
  <text x="104" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">유일한 거부 = 얼굴 없음</text>

  <line x1="192" y1="167" x2="216" y2="167" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>

  <!-- S1 -->
  <rect x="220" y="92" width="168" height="150" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="304" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">S1 · 색 관측</text>
  <text x="304" y="148" text-anchor="middle" font-size="11.5" fill="#0e7490">스킨 기준 화이트밸런스</text>
  <text x="304" y="170" text-anchor="middle" font-size="11.5" fill="#0e7490">밴드 + 파서 마스크</text>
  <text x="304" y="192" text-anchor="middle" font-size="11.5" fill="#0e7490">클러스터 대표색</text>
  <rect x="244" y="206" width="120" height="26" rx="7" fill="#fff" stroke="#22d3ee"/>
  <text x="304" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">신뢰도 / 폴백 판단</text>

  <line x1="392" y1="167" x2="416" y2="167" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>

  <!-- S2 -->
  <rect x="420" y="92" width="168" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="504" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">S2 · 분류 (VLM)</text>
  <text x="504" y="148" text-anchor="middle" font-size="11.5" fill="#92400e">5필드 스키마</text>
  <text x="504" y="170" text-anchor="middle" font-size="11.5" fill="#92400e">이중 질의 → 불확실성</text>
  <text x="504" y="192" text-anchor="middle" font-size="11.5" fill="#92400e">Gemini/Ollama/OpenRouter</text>
  <rect x="444" y="206" width="120" height="26" rx="7" fill="#fff" stroke="#fbbf24"/>
  <text x="504" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">픽셀은 만들지 않음</text>

  <line x1="592" y1="167" x2="616" y2="167" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>

  <!-- S3 -->
  <rect x="620" y="92" width="168" height="150" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="704" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">S3 · 렌더</text>
  <text x="704" y="148" text-anchor="middle" font-size="11.5" fill="#166534">파라메트릭 텍스처</text>
  <text x="704" y="170" text-anchor="middle" font-size="11.5" fill="#166534">하체 폴백 정책</text>
  <text x="704" y="192" text-anchor="middle" font-size="11.5" fill="#166534">결정적 노이즈 시드</text>
  <rect x="644" y="206" width="120" height="26" rx="7" fill="#fff" stroke="#4ade80"/>
  <text x="704" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">클래식 / 슬림</text>

  <line x1="792" y1="167" x2="816" y2="167" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>

  <!-- S4 -->
  <rect x="820" y="92" width="140" height="150" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="890" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">S4 · 후보</text>
  <text x="890" y="148" text-anchor="middle" font-size="11.5" fill="#475569">불일치 시</text>
  <text x="890" y="168" text-anchor="middle" font-size="11.5" fill="#475569">1~3 변형</text>
  <text x="890" y="192" text-anchor="middle" font-size="11.5" fill="#475569">랭킹 없음</text>
  <rect x="840" y="206" width="100" height="26" rx="7" fill="#fff" stroke="#94a3b8"/>
  <text x="890" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">전부 검증 통과</text>

  <!-- web bar -->
  <rect x="20" y="282" width="940" height="72" rx="12" fill="#0f172a"/>
  <text x="490" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">웹 앱 · FastAPI + React + three.js</text>
  <text x="490" y="336" text-anchor="middle" font-size="11.5" fill="#cbd5e1">POST /api/v1/generate-skin → 3D 뷰어 · 스킨 편집(원/투톤 신발) · 처리 과정 시트 · 분류 카테고리 표</text>
</svg>
